name: EB1A Phase 3 Metadata and Context Audit (Temporary)

on:
  push:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - scripts/eb1a_phase3_bundle.py
      - audit_inputs/phase3_bundle/**
      - .github/workflows/eb1a-phase3-audit.yml
  pull_request:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - scripts/eb1a_phase3_bundle.py
      - audit_inputs/phase3_bundle/**
      - .github/workflows/eb1a-phase3-audit.yml
  workflow_dispatch:

concurrency:
  group: eb1a-phase3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 lxml pymupdf rapidfuzz
      - name: Resolve metadata and extract citation-context candidates
        env:
          OPENALEX_MAILTO: m18129227366@163.com
        run: python scripts/eb1a_phase3_bundle.py
      - name: Upload Phase 3 output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-phase3-output
          path: audit_output_phase3/
          if-no-files-found: warn
          retention-days: 7
