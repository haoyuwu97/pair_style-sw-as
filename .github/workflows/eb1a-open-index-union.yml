name: EB1A Open Index Citation Union (Temporary)

on:
  push:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - scripts/eb1a_fetch_fast.py
      - .github/workflows/eb1a-open-index-union.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests beautifulsoup4 lxml
      - name: Retrieve OpenAlex, Semantic Scholar, OpenCitations, CitationMap and Scholar diagnostics
        run: python scripts/eb1a_fetch_fast.py
      - name: Upload complete open-index output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-open-index-union-output
          path: audit_output_fast/
          if-no-files-found: warn
          retention-days: 7
