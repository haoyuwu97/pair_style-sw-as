name: EB1A Corrected Web Citation Gap Scan (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/web_reference_gap_fast_v2.py
      - .github/workflows/eb1a-web-gap-fast-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 lxml pypdf
      - run: python scripts/web_reference_gap_fast_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-web-gap-fast-v2
          path: web_gap_fast_v2_output/
          retention-days: 7
