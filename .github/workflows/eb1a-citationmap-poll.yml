name: EB1A CitationMap Poll (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/citationmap_poll.py
      - .github/workflows/eb1a-citationmap-poll.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/citationmap_poll.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citationmap-complete-poll
          path: citationmap_poll_output/
          if-no-files-found: warn
          retention-days: 7
