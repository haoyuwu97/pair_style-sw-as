name: EB1A Phase 3 Fast Author Metadata Audit (Temporary)

on:
  push:
    branches:
      - eb1a-phase3-isolated-20260822
    paths:
      - scripts/eb1a_phase3_metadata_fast.py
      - scripts/eb1a_phase3_metadata_fast_all.py
      - scripts/eb1a_phase3_metadata_unresolved.py
      - .github/workflows/eb1a-phase3-metadata-fast.yml
  pull_request:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - scripts/eb1a_phase3_metadata_fast.py
      - scripts/eb1a_phase3_metadata_fast_all.py
      - scripts/eb1a_phase3_metadata_unresolved.py
      - .github/workflows/eb1a-phase3-metadata-fast.yml
  workflow_dispatch:

concurrency:
  group: eb1a-phase3-metadata-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  resolve-authors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eb1a-phase3-isolated-20260822
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata-audit dependencies
        run: python -m pip install --upgrade pip requests rapidfuzz beautifulsoup4 lxml pymupdf
      - name: Resolve the 73 Phase 2 unresolved author records
        env:
          OPENALEX_MAILTO: m18129227366@163.com
        run: python scripts/eb1a_phase3_metadata_unresolved.py
      - name: Upload fast metadata output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-phase3-metadata-fast-output
          path: audit_output_phase3_metadata_fast/
          if-no-files-found: warn
          retention-days: 7
      - name: Persist successful output to isolated branch
        if: success()
        run: |
          rm -rf audit_results/phase3_metadata_fast
          mkdir -p audit_results/phase3_metadata_fast
          cp -a audit_output_phase3_metadata_fast/. audit_results/phase3_metadata_fast/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit_results/phase3_metadata_fast
          if ! git diff --cached --quiet; then
            git commit -m "Persist fast Phase 3 author metadata results"
            git push origin HEAD:eb1a-phase3-isolated-20260822
          fi
