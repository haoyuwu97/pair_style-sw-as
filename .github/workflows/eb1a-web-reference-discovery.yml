name: EB1A Web Reference Discovery (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/web_reference_discovery.py
      - .github/workflows/eb1a-web-reference-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 lxml pypdf
      - run: python scripts/web_reference_discovery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-web-reference-discovery
          path: web_reference_discovery_output/
          retention-days: 7
