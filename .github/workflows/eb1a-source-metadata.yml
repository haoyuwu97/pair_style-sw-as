name: EB1A Source Metadata and Open Citation Union (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/eb1a_source_metadata.py
      - scripts/eb1a_fetch_fast.py
      - .github/workflows/eb1a-source-metadata.yml
  push:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - scripts/eb1a_source_metadata.py
      - scripts/eb1a_fetch_fast.py
      - .github/workflows/eb1a-source-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests beautifulsoup4 lxml
      - name: Retrieve source metadata
        run: python scripts/eb1a_source_metadata.py
      - name: Retrieve complete OpenAlex, Semantic Scholar and OpenCitations incoming-citation lists
        run: python scripts/eb1a_fetch_fast.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-source-metadata-and-open-index-union
          path: |
            source_metadata_output/
            audit_output_fast/
          if-no-files-found: warn
          retention-days: 7
