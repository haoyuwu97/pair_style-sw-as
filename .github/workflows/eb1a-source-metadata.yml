name: EB1A Source Metadata (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/eb1a_source_metadata.py
      - .github/workflows/eb1a-source-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python scripts/eb1a_source_metadata.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-source-metadata
          path: source_metadata_output/
          if-no-files-found: warn
          retention-days: 7
