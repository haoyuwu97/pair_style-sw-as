name: EB1A Public Text Reader Scholar Test (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/jina_scholar_test.py
      - .github/workflows/eb1a-jina-scholar-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/jina_scholar_test.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-jina-scholar-test
          path: jina_scholar_test_output/
          retention-days: 7
