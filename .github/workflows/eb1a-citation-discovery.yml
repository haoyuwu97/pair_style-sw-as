name: EB1A Citation Discovery (Temporary)

on:
  push:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - scripts/eb1a_discover.py
      - .github/workflows/eb1a-citation-discovery.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/eb1a_discover.py
      - .github/workflows/eb1a-citation-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temporary branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml scholarly

      - name: Discover citation data routes and retrieve open-index citation lists
        run: python scripts/eb1a_discover.py

      - name: Upload raw discovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-citation-discovery-output
          path: audit_output/
          if-no-files-found: warn
          retention-days: 7
