name: EB1A CitationMap JS Inspect (Temporary)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/citationmap_js_inspect.py
      - .github/workflows/eb1a-citationmap-js.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python scripts/citationmap_js_inspect.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citationmap-js-routes
          path: citationmap_js_output/
          if-no-files-found: warn
          retention-days: 7
