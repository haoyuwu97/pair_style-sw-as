name: EB1A Package Open Index Data (Temporary)

on:
  push:
    branches:
      - eb1a-citation-audit-20260821
    paths:
      - .github/workflows/eb1a-package-openindex.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package persisted citation-index files
        run: |
          find audit_results/open_index_union -maxdepth 1 -type f -printf '%f\n' | sort
          tar -czf eb1a-open-index-union.tar.gz audit_results/open_index_union
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: eb1a-open-index-union
          path: eb1a-open-index-union.tar.gz
          retention-days: 7
